    </rect>
    <rect x="4" y="8" width="4" height="1" fill="#34194F"/><rect x="2" y="9" width="8" height="1" fill="#34194F"/>
  </g>

  <text x="208" y="96" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#D1243F" textLength="564" lengthAdjust="spacing">THE HEALTH CHECK THAT WASN'T</text>
