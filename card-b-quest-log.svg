  <rect x="40" y="0" width="250" height="22" fill="#0B0610"/>
  <text x="54" y="17" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#D9A441">QUEST LOG · COMPLETE</text>

  <!-- larger monitor sprite, 12x10 grid at 10px -->
