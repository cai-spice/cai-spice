<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Project card: The Health Check That Wasn't. A web shell threat hunt using Microsoft Sentinel and KQL. 14 hunt steps, 13 ATT&amp;CK techniques, 9 kill chain phases. Quest log complete, hypothesis confirmed.">
