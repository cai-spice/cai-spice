    <rect x="2" y="2" width="1" height="1" fill="#D1243F"/><rect x="3" y="3" width="1" height="1" fill="#D1243F"/><rect x="2" y="4" width="1" height="1" fill="#D1243F"/>
    <rect x="5" y="4" width="3" height="1" fill="#D1243F">
