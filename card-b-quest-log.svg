  <text x="208" y="170" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="1" fill="#E8D9B5" xml:space="preserve">[ 14 STEPS ]  [ 13 TECHNIQUES ]  [ 9 PHASES ]</text>

  <g fill="#D1243F" shape-rendering="crispEdges">
