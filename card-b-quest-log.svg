    <rect x="1030" y="64" width="14" height="14"/><rect x="1050" y="64" width="14" height="14"/><rect x="1070" y="64" width="14" height="14"/>
    <rect x="1090" y="64" width="14" height="14"/><rect x="1110" y="64" width="14" height="14"/><rect x="1130" y="64" width="14" height="14"/>
  </g>
  <text x="1144" y="104" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="1" fill="#A89A78">KILL CHAIN · 9 PHASES</text>
