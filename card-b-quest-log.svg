  <g fill="#E8D9B5" shape-rendering="crispEdges">
    <rect x="12" y="8" width="1176" height="4"/><rect x="12" y="208" width="1176" height="4"/>
    <rect x="4" y="16" width="4" height="188"/><rect x="1192" y="16" width="4" height="188"/>
