<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Profile banner: pixel castle with name and tagline">
  <rect width="800" height="220" fill="#0B0610"/>
  <!-- notched pixel frame -->
  <rect x="8" y="4" width="784" height="4" fill="#5B2A86"/>
  <rect x="8" y="212" width="784" height="4" fill="#5B2A86"/>
  <rect x="4" y="8" width="4" height="204" fill="#5B2A86"/>
  <rect x="792" y="8" width="4" height="204" fill="#5B2A86"/>
  <!-- stars -->
  <rect x="236" y="36" width="4" height="4" fill="#E8D9B5"/>
  <rect x="300" y="168" width="4" height="4" fill="#C3A1F0"/>
  <rect x="716" y="48" width="4" height="4" fill="#E8D9B5"/>
  <rect x="660" y="176" width="4" height="4" fill="#C3A1F0"/>
  <!-- moon -->
  <rect x="728" y="28" width="20" height="20" fill="#D9A441"/>
  <rect x="720" y="28" width="8" height="20" fill="#0B0610"/>
  <!-- castle sprite, 16x14 grid at 10px per pixel -->
  <g transform="translate(40 36) scale(10)" shape-rendering="crispEdges">
    <rect x="2" y="0" width="2" height="1" fill="#D1243F"/><rect x="12" y="0" width="2" height="1" fill="#D1243F"/><rect x="2" y="1" width="1" height="1" fill="#34194F"/><rect x="13" y="1" width="1" height="1" fill="#34194F"/><rect x="1" y="2" width="1" height="1" fill="#5B2A86"/><rect x="4" y="2" width="1" height="1" fill="#5B2A86"/><rect x="11" y="2" width="1" height="1" fill="#5B2A86"/><rect x="14" y="2" width="1" height="1" fill="#5B2A86"/><rect x="1" y="3" width="4" height="1" fill="#5B2A86"/><rect x="11" y="3" width="4" height="1" fill="#5B2A86"/><rect x="1" y="4" width="1" height="1" fill="#5B2A86"/><rect x="2" y="4" width="1" height="1" fill="#D9A441"/><rect x="3" y="4" width="1" height="1" fill="#34194F"/><rect x="4" y="4" width="1" height="1" fill="#5B2A86"/><rect x="6" y="4" width="1" height="1" fill="#5B2A86"/><rect x="9" y="4" width="1" height="1" fill="#5B2A86"/><rect x="11" y="4" width="1" height="1" fill="#5B2A86"/><rect x="12" y="4" width="1" height="1" fill="#D9A441"/><rect x="13" y="4" width="1" height="1" fill="#34194F"/><rect x="14" y="4" width="1" height="1" fill="#5B2A86"/><rect x="1" y="5" width="1" height="1" fill="#5B2A86"/><rect x="2" y="5" width="2" height="1" fill="#34194F"/><rect x="4" y="5" width="8" height="1" fill="#5B2A86"/><rect x="12" y="5" width="2" height="1" fill="#34194F"/><rect x="14" y="5" width="1" height="1" fill="#5B2A86"/><rect x="1" y="6" width="14" height="1" fill="#5B2A86"/><rect x="1" y="7" width="2" height="1" fill="#5B2A86"/><rect x="3" y="7" width="1" height="1" fill="#34194F"/><rect x="4" y="7" width="8" height="1" fill="#5B2A86"/><rect x="12" y="7" width="1" height="1" fill="#34194F"/><rect x="13" y="7" width="2" height="1" fill="#5B2A86"/><rect x="1" y="8" width="14" height="1" fill="#5B2A86"/><rect x="1" y="9" width="6" height="1" fill="#5B2A86"/><rect x="7" y="9" width="2" height="1" fill="#0B0610"/><rect x="9" y="9" width="6" height="1" fill="#5B2A86"/><rect x="1" y="10" width="2" height="1" fill="#5B2A86"/><rect x="3" y="10" width="1" height="1" fill="#34194F"/><rect x="4" y="10" width="2" height="1" fill="#5B2A86"/><rect x="6" y="10" width="4" height="1" fill="#0B0610"/><rect x="10" y="10" width="2" height="1" fill="#5B2A86"/><rect x="12" y="10" width="1" height="1" fill="#34194F"/><rect x="13" y="10" width="2" height="1" fill="#5B2A86"/><rect x="1" y="11" width="5" height="1" fill="#5B2A86"/><rect x="6" y="11" width="4" height="1" fill="#0B0610"/><rect x="10" y="11" width="5" height="1" fill="#5B2A86"/><rect x="1" y="12" width="1" height="1" fill="#5B2A86"/><rect x="2" y="12" width="1" height="1" fill="#34194F"/><rect x="3" y="12" width="3" height="1" fill="#5B2A86"/><rect x="6" y="12" width="4" height="1" fill="#0B0610"/><rect x="10" y="12" width="3" height="1" fill="#5B2A86"/><rect x="13" y="12" width="1" height="1" fill="#34194F"/><rect x="14" y="12" width="1" height="1" fill="#5B2A86"/><rect x="0" y="13" width="16" height="1" fill="#34194F"/>
    <rect x="7" y="11" width="2" height="1.5" fill="#D1243F">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- text. Edit the name and tagline below. -->
  <text x="248" y="84" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="3" fill="#D9A441">&gt; CHARACTER SHEET</text>
  <text x="248" y="134" font-family="'Courier New', Courier, monospace" font-size="46" font-weight="700" fill="#E8D9B5">[YOUR NAME]</text>
  <text x="248" y="168" font-family="'Courier New', Courier, monospace" font-size="18" fill="#C3A1F0">[YOUR TAGLINE: class, guild, favorite spell]</text>
</svg>
